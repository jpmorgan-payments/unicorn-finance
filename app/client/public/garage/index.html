<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payments Garage — Unicorn Finance</title>
<meta name="description" content="One payment, San Jose to Palo Alto. Four beats, behind the J.P. Morgan Payments APIs.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Archivo:ital,wght@0,400;0,600;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --deep:#0C0620; --panel:rgba(14,8,34,.84); --line:#3A2566; --line-hot:#5B3A9E;
    --ink:#FDF6FF; --ink-dim:#BCA9DA; --ink-faint:#7B67A3;
    --magenta:#FF3E9D; --orange:#FF7A29; --gold:#FFD23F; --cyan:#3FE0F0;
    --uf:#31A88C; --uf-hot:#5BE8C0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--deep);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;overflow:hidden;}

  /* ---------- OUT RUN BACKDROP ---------- */
  #sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,
    #0A0424 0%,#240B4A 26%,#6B1B6E 46%,#C42E72 58%,#FF5C3C 66%,#FF9A2E 71%,#12081F 71.5%,#0C0620 100%);}
  #sun{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(46vh,420px);height:min(46vh,420px);border-radius:50%;z-index:1;
    background:linear-gradient(180deg,#FFE86B 0%,#FFC93C 30%,#FF6B4A 62%,#FF3E9D 100%);}
  #sun::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:repeating-linear-gradient(180deg,transparent 0 14px,var(--deep) 14px 19px);opacity:.92;
    -webkit-mask-image:linear-gradient(180deg,transparent 42%,#000 56%);
            mask-image:linear-gradient(180deg,transparent 42%,#000 56%);}
  #grid{position:fixed;left:-25%;right:-25%;bottom:0;height:29%;z-index:2;
    perspective:190px;perspective-origin:50% 0%;overflow:hidden;pointer-events:none;}
  #grid::before{content:"";position:absolute;inset:-140% 0 -40% 0;
    background:repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,62,157,.6) 78px 81px),
               repeating-linear-gradient(0deg,transparent 0 78px,rgba(63,224,240,.4) 78px 81px);
    transform:rotateX(72deg);transform-origin:50% 0%;animation:roll 2.6s linear infinite;}
  @keyframes roll{from{background-position:0 0,0 0;}to{background-position:0 0,0 81px;}}
  #horizon{position:fixed;left:0;right:0;bottom:29%;height:2px;z-index:3;
    background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),var(--magenta),transparent);
    box-shadow:0 0 22px rgba(255,62,157,.75);}
  #scan{position:fixed;inset:0;z-index:20;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;}
  #vig{position:fixed;inset:0;z-index:19;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(6,3,16,.72) 100%);}
  @media (prefers-reduced-motion:reduce){#grid::before{animation:none;}}

  /* ---------- SLIDES ---------- */
  #deck{position:fixed;inset:0;z-index:10;}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:clamp(50px,7vh,80px) clamp(28px,5.4vw,90px) 88px;
    animation:zoom .32s cubic-bezier(.2,.8,.3,1);}
  .slide.on{display:flex;}
  @keyframes zoom{from{opacity:0;transform:scale(.985) translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none;}}

  /* ---------- QR CARD ---------- */
  .qr{position:absolute;top:clamp(18px,3vh,30px);right:clamp(20px,3.6vw,48px);z-index:25;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:#fff;border-radius:10px;padding:14px 14px 11px;
    box-shadow:0 0 0 2px var(--cyan),0 0 34px rgba(63,224,240,.65),0 10px 34px rgba(0,0,0,.5);}
  .qr img{width:clamp(140px,15vw,190px);height:clamp(140px,15vw,190px);display:block;}
  .qr span{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:clamp(10.5px,1vw,13px);
    color:#160B2E;white-space:nowrap;}
  .qr-big{background:#fff;border-radius:14px;padding:clamp(18px,2.6vw,26px) clamp(18px,2.6vw,26px) clamp(14px,2vw,20px);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    box-shadow:0 16px 50px rgba(0,0,0,.55);}
  .qr-big img{width:clamp(210px,27vw,320px);height:clamp(210px,27vw,320px);display:block;}
  .qr-big span{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:clamp(12px,1.15vw,15px);
    color:#160B2E;white-space:nowrap;}

  .eyebrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-bottom:clamp(12px,2vh,22px);font-family:"Press Start 2P",monospace;
    font-size:clamp(8px,.78vw,10.5px);color:var(--cyan);text-shadow:0 0 12px rgba(63,224,240,.55);}
  h1{font-weight:900;font-style:italic;font-size:clamp(42px,8.4vw,116px);line-height:.85;
    letter-spacing:-.038em;text-transform:uppercase;text-wrap:balance;
    background:linear-gradient(180deg,#FFF 6%,#FFE86B 34%,#FF9A2E 54%,#FF3E9D 84%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(90,20,90,.85)) drop-shadow(0 0 26px rgba(255,62,157,.45))
      drop-shadow(0 0 3px rgba(6,3,16,.9)) drop-shadow(0 0 14px rgba(6,3,16,.75));}
  h2{font-weight:900;font-style:italic;font-size:clamp(28px,4.9vw,66px);line-height:1;
    letter-spacing:-.03em;text-transform:uppercase;max-width:19ch;text-wrap:balance;
    text-shadow:0 2px 0 rgba(90,20,90,.9),0 0 24px rgba(255,62,157,.3);}
  h2 em{font-style:italic;color:var(--gold);text-shadow:0 2px 0 #7A2600,0 0 22px rgba(255,210,63,.6);}
  h2 .uf{color:var(--uf-hot);text-shadow:0 2px 0 #06382C,0 0 22px rgba(91,232,192,.55);}
  h3{font-family:"Press Start 2P",monospace;font-size:clamp(11px,1.3vw,17px);line-height:1.5;
    color:var(--gold);margin-bottom:14px;text-shadow:0 2px 0 #7A2600;}
  .lede{font-size:clamp(15px,1.6vw,22px);line-height:1.5;color:var(--ink-dim);max-width:50ch;margin-top:clamp(12px,2vh,22px);
    text-shadow:0 1px 4px rgba(4,2,12,.75),0 0 18px rgba(4,2,12,.5);}
  .say{font-size:clamp(13.5px,1.42vw,18.5px);line-height:1.55;color:var(--ink-dim);max-width:56ch;margin-top:14px;
    text-shadow:0 1px 4px rgba(4,2,12,.75),0 0 18px rgba(4,2,12,.5);}
  .say b{color:var(--gold);font-weight:800;}
  .say .uf{color:var(--uf-hot);font-weight:800;}
  .rule{height:4px;width:clamp(90px,11vw,170px);margin:clamp(12px,1.8vh,20px) 0;border-radius:2px;
    background:linear-gradient(90deg,var(--gold),var(--magenta));box-shadow:0 0 18px rgba(255,62,157,.7);}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,46px);align-items:start;margin-top:clamp(10px,1.6vh,20px);}
  @media (max-width:940px){.cols{grid-template-columns:1fr;gap:16px;}}

  /* ---------- the docket: our one payment ---------- */
  .docket{display:flex;align-items:stretch;gap:clamp(8px,1.2vw,18px);flex-wrap:wrap;
    margin-top:clamp(14px,2.2vh,26px);}
  .leg{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:clamp(12px,1.4vw,20px) clamp(14px,1.6vw,24px);backdrop-filter:blur(7px);
    display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1;}
  .leg .lbl{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--cyan);}
  .leg .big{font-weight:900;font-style:italic;text-transform:uppercase;
    font-size:clamp(19px,2.5vw,34px);line-height:1;letter-spacing:-.025em;}
  .leg .sm{font-size:clamp(11.5px,1.05vw,14.5px);color:var(--ink-faint);}
  .leg.amt{border-color:var(--cyan);background:linear-gradient(180deg,rgba(10,6,24,.88),rgba(10,6,24,.8));
    box-shadow:0 0 24px rgba(0,0,0,.4);}
  .leg.amt .big{color:var(--cyan);text-shadow:0 2px 0 #06323A,0 0 16px rgba(63,224,240,.7);}
  .arrow{display:flex;align-items:center;font-size:clamp(20px,2.6vw,36px);color:var(--magenta);
    text-shadow:0 0 18px rgba(255,62,157,.8);font-weight:900;}

  pre{background:rgba(4,2,12,.9);border:1px solid var(--line-hot);border-left:3px solid var(--cyan);
    border-radius:6px;padding:clamp(11px,1.25vw,18px);overflow:auto;max-height:44vh;
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:clamp(10px,.96vw,13.5px);line-height:1.6;color:#C6B8E8;backdrop-filter:blur(6px);}
  .k{color:var(--cyan);} .s{color:var(--gold);} .n{color:#8FE3B4;}
  .c{color:var(--ink-faint);font-style:italic;}
  .hl{background:rgba(255,62,157,.26);border-radius:2px;padding:1px 4px;color:#FFC9E4;}
  .path{font-family:"JetBrains Mono",monospace;font-size:clamp(11px,1.05vw,15px);
    color:var(--cyan);background:rgba(10,5,26,.85);border:1px solid var(--line-hot);
    border-radius:5px;padding:8px 12px;display:inline-block;margin-top:10px;word-break:break-all;}
  .path .verb{color:var(--gold);font-weight:500;}

  ul.pts{list-style:none;display:flex;flex-direction:column;gap:clamp(9px,1.3vh,17px);margin-top:4px;}
  ul.pts li{font-size:clamp(13px,1.3vw,17.5px);line-height:1.45;color:var(--ink-dim);padding-left:22px;position:relative;}
  ul.pts li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold),var(--magenta));}
  ul.pts li strong{color:var(--ink);font-weight:800;}
  ul.pts li code,.say code,p code{font-family:"JetBrains Mono",monospace;font-size:.88em;color:var(--cyan);}

  .bays{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1vw,15px);margin-top:clamp(14px,2.4vh,28px);}
  @media (max-width:900px){.bays{grid-template-columns:repeat(2,1fr);}}

  /* ---------- STATUS TRACKER (GPI Track and Trace) ---------- */
  .steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:clamp(14px,2.2vh,26px);}
  .step{font-family:"Press Start 2P",monospace;font-size:clamp(7.5px,.8vw,10.5px);
    padding:9px 11px;border-radius:4px;border:1px solid var(--line);color:var(--ink-faint);
    background:var(--panel);backdrop-filter:blur(6px);}
  .step.done{border-color:var(--uf-hot);color:var(--uf-hot);}
  .step.on{border-color:var(--cyan);color:var(--cyan);text-shadow:0 0 10px rgba(63,224,240,.6);
    box-shadow:0 0 20px rgba(63,224,240,.4);}
  .step.retry{border-color:var(--gold);color:var(--gold);text-shadow:0 0 10px rgba(255,210,63,.6);
    box-shadow:0 0 20px rgba(255,210,63,.35);}
  .step.err{border-color:#FF4D4D;color:#FF4D4D;text-shadow:0 0 10px rgba(255,77,77,.6);
    box-shadow:0 0 20px rgba(255,77,77,.35);}
  .steps .arrow2{color:var(--ink-faint);font-size:15px;font-weight:900;}

  /* ---------- HOP MAP (global, every rail) ---------- */
  .hopmap{margin-top:clamp(14px,2vh,22px);border:1px solid var(--line);border-radius:10px;
    background:var(--panel);backdrop-filter:blur(7px);padding:10px;max-width:820px;}
  .hopmap svg{width:100%;height:auto;display:block;}
  .hopmap .landmass path{fill:rgba(63,224,240,.09);stroke:var(--line-hot);stroke-width:1;}
  .hopmap .hop{stroke:var(--gold);stroke-width:2;fill:none;stroke-dasharray:6 7;opacity:.9;
    filter:drop-shadow(0 0 6px rgba(255,210,63,.55));animation:hopflow 2.2s linear infinite;}
  .hopmap .node circle{fill:var(--magenta);filter:drop-shadow(0 0 8px rgba(255,62,157,.8));}
  .hopmap .node.origin circle{fill:var(--cyan);filter:drop-shadow(0 0 8px rgba(63,224,240,.8));}
  .hopmap .node text{font-family:"Press Start 2P",monospace;font-size:9.5px;fill:var(--ink);text-anchor:middle;}
  @keyframes hopflow{to{stroke-dashoffset:-130;}}
  @media (prefers-reduced-motion:reduce){.hopmap .hop{animation:none;}}
  .baycard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--magenta);
    border-radius:7px;padding:clamp(11px,1.3vw,18px);display:flex;flex-direction:column;gap:7px;backdrop-filter:blur(7px);
    transition:opacity .3s,filter .3s;}
  .baycard.dim{opacity:.28;filter:blur(1.2px) grayscale(.5);border-top-color:var(--line);}
  .baycard .no{font-family:"Press Start 2P",monospace;font-size:clamp(13px,1.5vw,20px);
    color:var(--gold);text-shadow:0 2px 0 #7A2600;}
  .baycard .no.flag{font-size:clamp(30px,4vw,50px);line-height:1;}
  .baycard .beat{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--cyan);
    text-shadow:0 0 10px rgba(63,224,240,.5);}
  .baycard .nm{font-weight:900;font-style:italic;text-transform:uppercase;
    font-size:clamp(14px,1.65vw,22px);line-height:1;letter-spacing:-.02em;}
  .baycard .api{font-family:"JetBrains Mono",monospace;font-size:clamp(9.5px,.85vw,11.5px);color:var(--uf-hot);}
  .baycard .d{font-size:clamp(11.5px,1vw,14px);color:var(--ink-dim);line-height:1.42;}
  .baycard .head{display:flex;align-items:baseline;gap:9px;}
  .baycard .routing{font-family:"JetBrains Mono",monospace;font-weight:700;
    font-size:clamp(15px,1.7vw,21px);color:var(--cyan);text-shadow:0 0 10px rgba(63,224,240,.5);}
  .baycard .routing.hl{color:#FFC9E4;background:rgba(255,62,157,.26);border-radius:3px;
    padding:1px 6px;display:inline-block;}

  .stat{display:flex;gap:clamp(16px,3vw,44px);flex-wrap:wrap;margin-top:clamp(12px,2vh,22px);}
  .stat div{display:flex;flex-direction:column;gap:5px;}
  .stat .big{font-family:"Press Start 2P",monospace;font-size:clamp(14px,1.9vw,25px);
    color:var(--gold);text-shadow:0 2px 0 #7A2600,0 0 20px rgba(255,210,63,.5);}
  .stat .lbl{font-size:clamp(10.5px,.95vw,13px);color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:.13em;font-weight:700;max-width:22ch;}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:clamp(12px,2vh,22px);}
  @media (max-width:820px){.board{grid-template-columns:repeat(2,1fr);}}
  .p{background:rgba(10,5,26,.72);border:1px solid var(--line);border-radius:5px;padding:10px 12px;
    font-size:clamp(11px,1.05vw,15px);color:var(--ink-faint);font-weight:600;backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:48px;}
  .p.us{background:linear-gradient(180deg,rgba(255,210,63,.22),rgba(255,122,41,.18));
    border-color:var(--gold);color:var(--gold);font-weight:900;
    box-shadow:0 0 26px rgba(255,210,63,.42);text-shadow:0 1px 0 #7A2600;transform:scale(1.035);}
  .p .tag{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--magenta);margin-top:5px;text-shadow:none;}

  .chequer{height:22px;margin-top:18px;border-radius:3px;
    background:repeating-conic-gradient(#FDF6FF 0% 25%,#160B2E 0% 50%) 0 0/22px 22px;opacity:.9;}

  /* ---------- footer HUD (audience-safe) ---------- */
  #bar{position:fixed;left:0;right:0;bottom:0;height:58px;z-index:30;
    background:linear-gradient(180deg,rgba(10,4,26,.5),rgba(8,3,20,.97));
    border-top:2px solid var(--magenta);box-shadow:0 -6px 30px rgba(255,62,157,.28);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(16px,3vw,40px);gap:16px;}
  #trip{font-family:"JetBrains Mono",monospace;font-size:clamp(10px,.95vw,13px);color:var(--ink-faint);}
  #trip b{color:var(--uf-hot);font-weight:500;}
  #count{font-family:"Press Start 2P",monospace;color:var(--cyan);font-size:10px;
    text-shadow:0 0 10px rgba(63,224,240,.6);white-space:nowrap;}
  #prog{position:fixed;left:0;bottom:58px;height:3px;z-index:31;
    background:linear-gradient(90deg,var(--cyan),var(--gold),var(--magenta));
    box-shadow:0 0 14px rgba(255,62,157,.8);transition:width .3s;}
  #nav{position:fixed;bottom:70px;right:18px;z-index:32;display:flex;gap:6px;}
  #nav button{background:rgba(14,8,34,.85);border:1px solid var(--line-hot);color:var(--ink-faint);
    width:34px;height:34px;border-radius:4px;cursor:pointer;font-size:15px;line-height:1;
    font-family:"Archivo",sans-serif;transition:.15s;}
  #nav button:hover,#nav button:focus-visible{border-color:var(--gold);color:var(--gold);outline:none;}

  /* ---------- terminal moment ---------- */
  .term{background:#05070A;border:1px solid var(--line-hot);border-radius:8px;
    overflow:hidden;margin-top:clamp(12px,2vh,20px);box-shadow:0 14px 40px rgba(0,0,0,.5);}
  .term .bar{display:flex;align-items:center;gap:7px;padding:9px 13px;
    background:rgba(255,255,255,.05);border-bottom:1px solid var(--line-hot);}
  .term .bar i{width:10px;height:10px;border-radius:50%;display:block;}
  .term .bar .r{background:#FF5F57;} .term .bar .y{background:#FEBC2E;} .term .bar .g{background:#28C840;}
  .term .bar span{margin-left:8px;font-family:"JetBrains Mono",monospace;
    font-size:11px;color:var(--ink-faint);}
  .term .body{padding:clamp(13px,1.5vw,20px);font-family:"JetBrains Mono",monospace;
    font-size:clamp(11px,1.08vw,15px);line-height:1.75;}
  .term .cmd{color:#EDE7FF;}
  .term .cmd::before{content:"$ ";color:var(--gold);font-weight:500;}
  .term .out{color:var(--ink-faint);}
  .term .ok{color:#5BE8C0;}
  .term .url{color:var(--cyan);text-decoration:underline;text-underline-offset:3px;}
  .term .cur{display:inline-block;width:9px;height:1.05em;background:var(--gold);
    vertical-align:-2px;margin-left:3px;animation:blink 1s steps(2,end) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){.term .cur{animation:none;}}
</style>
</head>
<body>
<div id="sky"></div><div id="sun"></div><div id="grid"></div><div id="horizon"></div>
<div id="deck"></div>
<div id="vig"></div><div id="scan"></div>
<div id="prog"></div>
<div id="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
<div id="bar"><div id="trip"></div><div id="count"></div></div>

<script>
const TRIPS = {};
const S=[

/* 0 */ {html:`
<div class="eyebrow">J.P. MORGAN PAYMENTS &nbsp;·&nbsp; INSERT COIN</div>
<h1>Insert<br>Coin.</h1>
<div class="rule"></div>
<div class="say">Every repo behind today's demo lives in the open, at <span class="uf">github.com/jpmorgan-payments</span>.</div>
<div class="say"><b>I'm going to show you, through one of them, what it means to Insert Coin - send a $100,000 coin through US RTP, and a few other rails.</b></div>`},

/* 1b */ {html:`
<div class="qr"><img src="assets/repo-qr.svg" alt="QR code to github.com/jpmorgan-payments/unicorn-finance"><span>github.com/jpmorgan-payments/unicorn-finance</span></div>
<div class="eyebrow">BEFORE WE OPEN ANYTHING</div>
<h2>One command.<br>No <em>keys</em>.</h2>
<div class="term">
  <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span>unicorn-finance</span></div>
  <div class="body">
    <div class="cmd">git clone github.com/jpmorgan-payments/unicorn-finance</div>
    <div class="cmd">cd unicorn-finance</div>
    <div class="cmd">docker compose up</div>
    <div class="out">building client…</div>
    <div class="out">mock service worker registered</div>
    <div class="ok">✓ ready on <span class="url">http://localhost:3000</span><span class="cur"></span></div>
  </div>
</div>`},

/* 13 */ {html:`
<div class="qr"><img src="assets/repo-qr.svg" alt="QR code to github.com/jpmorgan-payments/unicorn-finance"><span>github.com/jpmorgan-payments/unicorn-finance</span></div>
<div class="eyebrow">OFF THE FORECOURT</div>
<h2>Three tiers,<br>in <em>order</em></h2>

/* 5f */ {bay:2, html:`

<div class="steps">
  <span class="step done">RECEIVED</span><span class="arrow2">→</span>
  <span class="step done">ACCEPTED</span><span class="arrow2">→</span>
  <span class="step done">PROCESSING</span><span class="arrow2">→</span>
  <span class="step retry">RETRY</span><span class="arrow2">→</span>
  <span class="step on">COMPLETED</span>
</div>
<div class="say">Operational hiccup. Absorbed, retried, and it still lands.</div>
<div class="steps">
  <span class="step done">RECEIVED</span><span class="arrow2">→</span>
  <span class="step done">ACCEPTED</span><span class="arrow2">→</span>

</div>

/* 5g */ {bay:2, html:`
<div class="eyebrow">BEHIND THE API &nbsp;·&nbsp; RETRY SAFELY</div>
<h2>Accepted?<br>We've got <em>it</em>.</h2>
<span class="path"><span class="verb">POST</span> /payment/v2/payments</span>
<pre><span class="c">// once accepted, retries between stages are on us</span>
{
  paymentIdentifiers: { <span class="hl">endToEndId: "UF1756..."</span> },
  ...
}</pre>
<div class="say">Once J.P. Morgan accepts it, any operational hiccup between stages gets retried on our side - automatically, at scale, on every rail.</div>
<div class="say"><b>One key, endToEndId, keeps every retry safe.</b> No duplicate payments, no noise to you. Same rule, every method, every currency - RTP, ACH, WIRE, FPS, SEPA Instant, PIX, IMPS.</div>`},

/* 5h */ {bay:2, html:`
<div class="eyebrow">BEHIND THE API &nbsp;·&nbsp; THE RETRY LOOP</div>
<h2>Stuck isn't<br><em>lost</em>.</h2>
<div class="bays" style="grid-template-columns:repeat(4,1fr)">
  <div class="baycard"><span class="no">01</span><span class="nm">Captured</span><span class="d">A technical hiccup - a timeout, a dropped connection - is captured with its context. Not silently dropped, not spammed back at the rail.</span></div>
  <div class="baycard"><span class="no">02</span><span class="nm">Retried</span><span class="d">Retried automatically, on a backoff, for a bounded window. Not forever, and not your problem to orchestrate.</span></div>
  <div class="baycard"><span class="no">03</span><span class="nm">Replayed</span><span class="d">Once the hiccup clears, it's replayed from where it left off. No resubmission needed from you.</span></div>
  <div class="baycard"><span class="no">04</span><span class="nm">Escalated</span><span class="d">Still stuck past that window? Escalated to a human. Never left silently spinning.</span></div>
</div>
<div class="say">Every hop is journaled before and after. <b>A retry resumes from the last save point - not from scratch, and never as a second payment.</b></div>
<div class="say">Not payments-specific. <b>It's a default every service gets from the platform underneath it.</b></div>`},

/* 9 */ {bay:3, html:`
<div class="eyebrow">BEHIND THE API</div>
<h3>CODES, NOT PASS / FAIL</h3>
<span class="path"><span class="verb">POST</span> /tsapi/v2/validations/accounts</span>
<div class="cols">
<pre><span class="c">// profile: verify + authenticate</span>
[{ <span class="hl">profileName: "authentication"</span>,
   account: { idType: <span class="s">"USABA"</span>, id: <span class="s">"121000248"</span> } }]

codes: {
  <span class="hl">verification</span>:   { code: <span class="n">1002</span>, message: <span class="s">"Open Valid"</span> },
  <span class="hl">authentication</span>: { code: <span class="n">5002</span>, message: <span class="s">"Ownership Match"</span> }
}</pre>
<pre><span class="c">// profile: confidence score</span>
[{ <span class="c">// no profileName - same URL</span>
   account: { idType: <span class="s">"USABA"</span>, id: <span class="s">"121000248"</span> } }]

accountScore: { code: <span class="n">1109</span>, message: <span class="s">"Information Found"</span> },
providerResponse: { score: <span class="n">628</span>, <span class="hl">rag: "GREEN"</span> }</pre>
</div>
<div class="say">Same URL, same account. <b>What you pass in the body decides the profile - two different questions.</b></div>
<div class="say">Verification: is it open and valid. Authentication: is it really theirs. <b>A boolean can't say "real, but not theirs" - that's why there isn't one.</b></div>`},

<div class="eyebrow">BRING YOUR OWN CAR</div>
<h2>Take it <em>home</em></h2>
<div class="cols">
<ul class="pts">
<li><strong>Run the container.</strong> <code>docker compose up</code>, then localhost:3000. Real request and response shapes, no keys, no VPN.</li>
<li><strong>Point your agent at pdp-skills and pdp-mcp.</strong> They teach Copilot or Claude Code our OAuth flow and API contracts, so it builds the integration alongside you.</li>
<li><strong>Get your keys.</strong> developer.payments.jpmorgan.com, and graduate to tier two.</li>

const deck=document.getElementById("deck"),trip=document.getElementById("trip"),
      cnt=document.getElementById("count"),prog=document.getElementById("prog");
let i=0;
S.forEach(s=>{const d=document.createElement("div");d.className="slide";d.innerHTML=s.html;deck.appendChild(d);});
const els=[...document.querySelectorAll(".slide")];
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  els.forEach((el,x)=>el.classList.toggle("on",x===i));
  trip.innerHTML = TRIPS[S[i].bay] ?? "";
  cnt.textContent="STAGE "+String(i+1).padStart(2,"0")+"/"+S.length;
  prog.style.width=((i+1)/S.length*100)+"%";
  try{localStorage.setItem("garage-slide",i);}catch(e){}
}
addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown","n"].includes(e.key)){e.preventDefault();show(i+1);}
  else if(["ArrowLeft","ArrowUp","PageUp","p"].includes(e.key)){e.preventDefault();show(i-1);}
  else if(e.key==="Home")show(0); else if(e.key==="End")show(S.length-1);
  else if(e.key==="f"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
document.getElementById("next").onclick=e=>{e.stopPropagation();show(i+1);};
document.getElementById("prev").onclick=e=>{e.stopPropagation();show(i-1);};
addEventListener("click",e=>{if(!e.target.closest("#bar")&&!e.target.closest("#nav"))show(i+(e.clientX<innerWidth*0.28?-1:1));});
let sx=0;
addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});
addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(i+(d<0?1:-1));},{passive:true});
let saved=0;try{saved=parseInt(localStorage.getItem("garage-slide"))||0;}catch(e){}
show(saved);
</script>
