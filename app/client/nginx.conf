server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/fx, /accounts, ...) all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tier 2 (++ real): forward CAT calls to the express proxy (`server` service,
    # `--profile real`). Strips the /cat-api/api prefix to match the server's
    # routes, mirroring the Vite dev proxy. Unused in the offline mock demo
    # (MSW handles /api in the browser). Requires certs - see .env.example.
    location /cat-api/api/ {
        # Resolve `server` at request time (Docker's embedded DNS) so this
        # offline container still starts when the `server` service is absent.
        resolver 127.0.0.11 valid=10s;
        set $cat_upstream server:8082;
        rewrite ^/cat-api/api/(.*)$ /$1 break;
        proxy_pass http://$cat_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Tier 2 (JPMC Mock): forward to the server's /mockapi mount, which attaches
    # the OAuth2 Bearer and proxies to api-mock. Same runtime-resolve trick.
    location /mock-api/api/ {
        resolver 127.0.0.11 valid=10s;
        set $mock_upstream server:8082;
        rewrite ^/mock-api/api/(.*)$ /mockapi/$1 break;
        proxy_pass http://$mock_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
