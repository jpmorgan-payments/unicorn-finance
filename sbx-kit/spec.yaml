# Unicorn Finance - Docker Sandboxes (sbx) kit. The sbx equivalent of compose.yaml.
#
#     sbx run claude --kit ./sbx-kit .
#
# Run it from the repo root: the mounted workspace must be the unicorn-finance checkout.
# Serves the app on sandbox port 3000 and starts the express proxy on 8082. sbx picks
# the host ports, so run `sbx ports <sandbox>` to see them, or pin them to match compose:
#
#     sbx ports <sandbox> --publish 3000:3000
#     sbx ports <sandbox> --publish 8082:8082
#
# How compose.yaml maps onto this kit:
#   client build + nginx  -> setup.install (nginx, pnpm) + startup script (pnpm build),
#                            nginx serves the bundle on :3000 and proxies to the server
#   client build args     -> kit args (--kit-arg enable_jpmc=true ...), falling back to
#                            the repo-root .env, just as compose substitutes them from it
#   server                -> startup script running `node app.local.js` on :8082
#   env_file: .env        -> the startup script sources ${WORKDIR}/.env if it's there
#   ./certs:/certs:ro     -> /opt/unicorn-finance/certs symlinked to ${WORKDIR}/certs
#
# Both apps are copied to /opt/unicorn-finance before installing, like the Dockerfiles'
# COPY. The Linux node_modules and dist stay out of your host checkout.
#
# Tier 1 (default): offline, no credentials. Every beat runs against the in-browser
#   MSW mock and the server sits idle.
# Tier 2 (++ real): put PDP_CLIENT_ID / PDP_CLIENT_SECRET in the repo-root .env and set
#   VITE_ENABLE_JPMC=true there, or pass `--kit-arg enable_jpmc=true`. Then restart the
#   sandbox so the client rebuilds. The server sends the OAuth client secret in the token
#   request body, not a header, so sbx's proxy can't inject it. It gets read from .env
#   inside the VM, the same way the compose `server` container reads it.
schemaVersion: "2"
kind: mixin
name: unicorn-finance
displayName: Unicorn Finance
description: Builds and serves the Unicorn Finance demo (client on :3000, express proxy on :8082)
sourceURL: https://github.com/jpmorgan-payments/unicorn-finance
licenses:
  - Apache-2.0

# Client build args (compose `client.build.args`). Empty = use the repo-root .env value,
# then the Dockerfile default. Never secrets: they are baked into the browser bundle.
args:
  enable_jpmc:
    default: ""
    pattern: "^(true|false)?$"
    description: Unlock the JPMC Mock / JPMC CAT tiers in the environment switcher
  client_id:
    default: ""
    description: VITE_CLIENT_ID header sent to JPMC CAT
  program_id:
    default: ""
    description: VITE_PROGRAM_ID header sent to JPMC CAT
  program_id_type:
    default: ""
    description: VITE_PROGRAM_ID_TYPE header sent to JPMC CAT

# compose `ports`. Host ports are ephemeral unless pinned with `sbx ports --publish`.
ports:
  - container: 3000
    name: client
  - container: 8082
    name: server

permissions:
  network:
    allow:
      # install + build
      - registry.npmjs.org
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      # Tier 2: JPMC Mock (OAuth2 token + api-mock) and JPMC CAT
      - id.payments.jpmorgan.com
      - api-mock.payments.jpmorgan.com
      - api-sandbox.payments.jpmorgan.com
      - apigatewaycat.jpmorgan.com

setup:
  install:
    - description: Install nginx to serve the client bundle (the client image's serve stage)
      command: |
        DEBIAN_FRONTEND=noninteractive apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nginx &&
        rm -f /etc/nginx/sites-enabled/default
    - description: Write the nginx site (app/client/nginx.conf, retargeted at localhost)
      command: |
        cat > /etc/nginx/conf.d/unicorn-finance.conf <<'EOF'
        server {
            listen 3000;
            server_name _;
            root /opt/unicorn-finance/client/dist;
            index index.html;

            # SPA fallback: client-side routes (/fx, /accounts, ...) all serve index.html.
            location / {
                try_files $uri $uri/ /index.html;
            }

            # Tier 2 (++ real): forward CAT calls to the express proxy.
            # No Docker DNS in here - the server runs alongside on 127.0.0.1:8082.
            location /cat-api/api/ {
                rewrite ^/cat-api/api/(.*)$ /$1 break;
                proxy_pass http://127.0.0.1:8082;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            # Tier 2 (JPMC Mock): forward to the server's /mockapi mount.
            location /mock-api/api/ {
                rewrite ^/mock-api/api/(.*)$ /mockapi/$1 break;
                proxy_pass http://127.0.0.1:8082;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
        EOF
    - description: Create the build directory (the images' WORKDIR /app)
      command: "mkdir -p /opt/unicorn-finance && chown 1000:1000 /opt/unicorn-finance"
    - description: Install pnpm (matches packageManager in both package.json files)
      command: "npm install -g pnpm@10.19.0"
      user: "1000"

  files:
    - path: /home/agent/.local/bin/unicorn-finance-server.sh
      mode: "0755"
      content: |
        #!/usr/bin/env bash
        # compose `server`: copy app/server, install, run app.local.js on :8082.
        set -euo pipefail
        exec > /tmp/unicorn-finance-server.log 2>&1
        SRC="${WORKDIR}/app/server"
        DEST=/opt/unicorn-finance/app
        [ -d "$SRC" ] || { echo "No $SRC - mount the unicorn-finance repo root as the workspace."; exit 1; }
        export PATH="$(npm prefix -g)/bin:$PATH"

        # app/server/.dockerignore: node_modules, .env, certs, logs, mock-server stay out.
        mkdir -p "$DEST"
        tar -C "$SRC" --exclude=node_modules --exclude='.env' --exclude='.env.*' \
          --exclude=certs --exclude='*.log' --exclude=mock-server -cf - . | tar -C "$DEST" -xf -
        # ./certs:/certs - app.local.js reads ../certs from its working directory.
        ln -sfn "${WORKDIR}/certs" /opt/unicorn-finance/certs

        cd "$DEST"
        pnpm install --frozen-lockfile

        # env_file: .env (required: false), then compose `environment`.
        if [ -f "${WORKDIR}/.env" ]; then set -a; . "${WORKDIR}/.env"; set +a; fi
        export NODE_ENV=development
        # Egress goes through the sandbox proxy. The OAuth token call uses built-in
        # fetch, which only honours HTTPS_PROXY with this set.
        export NODE_USE_ENV_PROXY=1
        exec node app.local.js

    - path: /home/agent/.local/bin/unicorn-finance-client.sh
      mode: "0755"
      content: |
        #!/usr/bin/env bash
        # compose `client` build stage: copy app/client, install, pnpm build.
        # nginx (started separately) serves the result from /opt/unicorn-finance/client/dist.
        set -euo pipefail
        exec > /tmp/unicorn-finance-client.log 2>&1
        SRC="${WORKDIR}/app/client"
        DEST=/opt/unicorn-finance/client
        [ -d "$SRC" ] || { echo "No $SRC - mount the unicorn-finance repo root as the workspace."; exit 1; }
        export PATH="$(npm prefix -g)/bin:$PATH"

        # app/client/.dockerignore: node_modules, dist, .env, logs stay out.
        mkdir -p "$DEST"
        tar -C "$SRC" --exclude=node_modules --exclude=dist --exclude='.env' --exclude='.env.*' \
          --exclude='*.log' -cf - . | tar -C "$DEST" -xf -

        cd "$DEST"
        pnpm install --frozen-lockfile

        # Build args: kit arg > repo-root .env > Dockerfile default.
        if [ -f "${WORKDIR}/.env" ]; then set -a; . "${WORKDIR}/.env"; set +a; fi
        arg_enable_jpmc="${{ kit.args.enable_jpmc }}"
        arg_client_id="${{ kit.args.client_id }}"
        arg_program_id="${{ kit.args.program_id }}"
        arg_program_id_type="${{ kit.args.program_id_type }}"
        export VITE_ENABLE_JPMC="${arg_enable_jpmc:-${VITE_ENABLE_JPMC:-false}}"
        export VITE_CLIENT_ID="${arg_client_id:-${VITE_CLIENT_ID:-}}"
        export VITE_PROGRAM_ID="${arg_program_id:-${VITE_PROGRAM_ID:-}}"
        export VITE_PROGRAM_ID_TYPE="${arg_program_id_type:-${VITE_PROGRAM_ID_TYPE:-}}"
        # Only the four VITE_ values above belong in the bundle.
        unset PDP_CLIENT_ID PDP_CLIENT_SECRET

        # Build into a temp dir and swap it in, so nginx keeps serving the last bundle.
        pnpm exec tsc
        pnpm exec vite build --outDir dist.next --emptyOutDir
        rm -rf dist && mv dist.next dist
        echo "Unicorn Finance built - serving on sandbox port 3000."

  startup:
    - description: Serve the client on :3000 (the client image's nginx CMD)
      command: ["nginx", "-g", "daemon off;"]
      user: "0"
      background: true
    - description: Start the express proxy on :8082
      command: ["/home/agent/.local/bin/unicorn-finance-server.sh"]
      background: true
    - description: Build the client bundle
      command: ["/home/agent/.local/bin/unicorn-finance-client.sh"]
      background: true

agentInstructions:
  content: |
    Unicorn Finance runs in this sandbox. nginx serves the client on port 3000 and the
    express proxy listens on 8082. Both are rebuilt from a copy in /opt/unicorn-finance
    on every sandbox start, so a restart picks up source edits. Logs are in
    /tmp/unicorn-finance-client.log and /tmp/unicorn-finance-server.log.
    Don't run `pnpm install` inside the mounted workspace. It shares the host checkout,
    so Linux node_modules would land on the host. Rerun the build script to rebuild:
    /home/agent/.local/bin/unicorn-finance-client.sh
